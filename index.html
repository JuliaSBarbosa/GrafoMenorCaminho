<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafo Menor Caminho</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>🧭 Algoritmo de Dijkstra</h1>

    <div class="legenda">

        <div class="item-legenda">
            <div class="cor inicio"></div>
            <span>Início</span>
        </div>

        <div class="item-legenda">
            <div class="cor objetivo"></div>
            <span>Objetivo</span>
        </div>

        <div class="item-legenda">
            <div class="cor obstaculo"></div>
            <span>Obstáculo</span>
        </div>

    </div>

    <div id="grid"></div>

    <button id="buscar">Buscar Caminho</button>

    <p id="metricas"></p>

    <p id="tamanho-caminho"></p>

    <button id="resetar">🔄 Resetar Caminho</button>

    <script src="js/script.js"></script>

</body>

</html>
