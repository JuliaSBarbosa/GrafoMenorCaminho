<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labirinto — Grafo Menor Caminho</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>🕹️ Labirinto — Grafo Menor Caminho</h1>
    <div class="controles">
        <label>Linhas <input type="number" id="input-linhas" min="5" max="25" value="11"></label>
        <label>Colunas <input type="number" id="input-colunas" min="5" max="25" value="11"></label>
        <button type="button" id="novo-labirinto">Novo labirinto</button>
        <label>Algoritmo
            <select id="algoritmo">
                <option value="dijkstra">Dijkstra</option>
                <option value="astar">A* (Manhattan)</option>
            </select>
        </label>
        <fieldset class="ferramentas" aria-label="Ferramenta de edicao">
            <legend>Ferramenta</legend>
            <input type="radio" name="modo-edicao" id="modo-inicio" value="inicio" checked>
            <label for="modo-inicio">Inicio</label>
            <input type="radio" name="modo-edicao" id="modo-objetivo" value="objetivo">
            <label for="modo-objetivo">Fim</label>
            <input type="radio" name="modo-edicao" id="modo-parede" value="parede">
            <label for="modo-parede">Parede</label>
            <input type="radio" name="modo-edicao" id="modo-lento" value="lento">
            <label for="modo-lento">Lento</label>
            <input type="radio" name="modo-edicao" id="modo-livre" value="livre">
            <label for="modo-livre">Livre</label>
        </fieldset>
    </div>
    <div class="legenda">
        <div class="item-legenda"><div class="cor inicio"></div><span>Inicio</span></div>
        <div class="item-legenda"><div class="cor objetivo"></div><span>Objetivo</span></div>
        <div class="item-legenda"><div class="cor obstaculo"></div><span>Obstaculo</span></div>
        <div class="item-legenda"><div class="cor lento"></div><span>Lento</span></div>
        <div class="item-legenda"><div class="cor caminho-legenda"></div><span>Caminho</span></div>
    </div>
    <div id="grid"></div>
    <button type="button" id="buscar">Buscar caminho</button>
    <button type="button" id="limpar-caminho">Limpar caminho</button>
    <button type="button" id="resetar">Resetar inicio / objetivo</button>
    <section id="painel-metricas" class="painel-metricas" aria-live="polite"></section>
    <script src="js/mazeGenerator.js"></script>
    <script src="js/pathfinding.js"></script>
    <script src="js/astar.js"></script>
    <script src="js/metricas.js"></script>
    <script src="js/script.js"></script>
    <dialog id="modal-erro" class="modal-aviso">
        <p id="modal-erro-mensagem">Nenhum caminho encontrado!</p>
        <button type="button" onclick="this.closest('dialog').close()">Fechar</button>
    </dialog>
</body>
</html>
