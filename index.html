<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafo Menor Caminho</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>Algoritmo de Dijkstra</h1>

    <div class="controles">
        <label>
            Linhas
            <input type="number" id="input-linhas" min="5" max="25" value="11">
        </label>
        <label>
            Colunas
            <input type="number" id="input-colunas" min="5" max="25" value="11">
        </label>
        <button type="button" id="novo-labirinto">Novo labirinto</button>
    </div>

    <div class="legenda">
        <div class="item-legenda">
            <div class="cor inicio"></div>
            <span>Inicio</span>
        </div>
        <div class="item-legenda">
            <div class="cor objetivo"></div>
            <span>Objetivo</span>
        </div>
        <div class="item-legenda">
            <div class="cor obstaculo"></div>
            <span>Obstaculo</span>
        </div>
    </div>

    <div id="grid"></div>

    <button type="button" id="buscar">Buscar Caminho</button>
    <p id="metricas"></p>
    <p id="tamanho-caminho"></p>
    <button type="button" id="resetar">Resetar Caminho</button>

    <script src="js/mazeGenerator.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
